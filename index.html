<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woolpert Maritime — Gantt</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#bfd4dd;color:#1c1f22;font-size:12px;display:flex;flex-direction:column;}
  .wrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px;}
  header.intro{flex:0 0 auto;margin-bottom:6px;display:flex;align-items:baseline;gap:10px;}
  header.intro h1{font-size:13px;font-weight:600;margin:0;color:#1c1f22;}
  header.intro span{font-size:11px;color:#5a6472;}

  .tabbar{flex:0 0 auto;display:flex;gap:2px;border-bottom:1px solid #c9c9c9;flex-wrap:wrap;}
  .tab{font-size:12px;padding:6px 12px;border:none;background:none;cursor:pointer;}
  .tab:hover{background:#f2f2f2;}

  .toolbar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 6px;padding:5px 2px;border-bottom:1px solid #c9c9c9;}
  .toolbar label{font-size:11.5px;color:#5a6472;display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;}
  .hint{font-size:10.5px;color:#8a929c;font-style:italic;}
  .btn{font-size:11.5px;padding:3px 9px;border-radius:3px;border:1px solid #9aa0a6;background:#fff;color:#1c1f22;cursor:pointer;}
  .btn:hover{background:#f0f0f0;}
  .spacer{flex:1;}
  .sync{font-size:11px;color:#5a6472;}
  .sync::before{content:"●";color:#4c9a5b;margin-right:4px;font-size:8px;}

  #tabcontent{flex:1;min-height:0;display:flex;flex-direction:column;}
  .sheetscroll{overflow:auto;border:1px solid #9aa0a6;background:#f7fafb;width:100%;flex:1;min-height:0;}
  #sheet{display:grid;font-size:11px;position:relative;}
  .cell{border:1px solid #d3d3d3;display:flex;align-items:stretch;position:relative;background:#fbfdfe;min-height:19px;}
  .lblnum,.lblname{position:sticky;z-index:3;background:#eef4f6;padding:0 3px;display:flex;align-items:center;border-right:1px solid #9aa0a6;font-size:10.5px;}
  .lblnum{left:0;justify-content:center;font-weight:600;}
  .lblname{left:34px;justify-content:space-between;gap:3px;}
  .idname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:11px;}
  .idname-input{border:none;background:transparent;font-size:11px;padding:0 1px;flex:1;min-width:0;color:#1c1f22;}
  .idname-input:focus{outline:1px solid #4a86c5;}
  .initials-input{width:100%;text-align:center;border:none;background:transparent;font-size:10.5px;font-weight:inherit;color:inherit;padding:0;}
  .initials-input:focus{outline:1px solid rgba(255,255,255,.85);}
  .lblname input{border:none;background:transparent;font-size:11px;font-weight:500;padding:0 1px;width:100%;color:#1c1f22;}
  .lblname input:focus{outline:1px solid #4a86c5;}
  .del{opacity:0;border:none;background:none;color:#a4373a;cursor:pointer;font-size:11px;padding:0 3px;flex-shrink:0;}
  .row:hover .del{opacity:.6;}
  .del:hover{opacity:1 !important;}

  .datehead{position:sticky;top:22px;z-index:4;background:#eef0f2;color:#1c1f22;flex-direction:column;align-items:center;justify-content:center;padding:1px;}
  .datehead .dow{font-size:8px;color:#5a6472;}
  .datehead .num{font-size:10.5px;font-weight:600;}
  .corner{position:sticky;top:22px;z-index:5;background:#eef0f2;}
  .corner.c1{left:0;}
  .corner.c2{left:34px;display:flex;align-items:center;padding-left:6px;font-size:10.5px;font-weight:600;color:#5a6472;}
  .datehead.today,.cell.today{background:#dbe9f7;}

  .subhead{grid-column:1/-1;min-height:18px;}
  .subhead-inner{position:sticky;left:0;display:inline-block;color:#3c3c3c;font-size:10.5px;font-weight:600;padding:2px 6px;white-space:nowrap;}
  .blockhead{grid-column:1/-1;min-height:19px;}
  .blockhead-inner{position:sticky;left:0;display:flex;align-items:center;gap:6px;padding:1px 5px;width:fit-content;}
  .blockhead input.btitle{font-size:11px;font-weight:600;border:none;background:transparent;color:#1c1f22;padding:0 2px;width:320px;flex:0 0 auto;}
  .blockhead input.bmeta{font-size:10.5px;border:none;background:transparent;color:#5a6472;padding:0 2px;width:230px;flex:0 0 auto;}
  .blockhead input:focus{outline:1px solid #4a86c5;}
  .blockhead .del{opacity:.5;flex:0 0 auto;}

  .monthhead{position:sticky;top:0;z-index:4;background:#0b3a4a;color:#fff;font-size:15px;font-weight:700;letter-spacing:.04em;padding:2px 10px;height:22px;display:flex;align-items:center;}
  .monthcorner{position:sticky;top:0;left:0;z-index:6;background:#0b3a4a;height:22px;}

  .addrow,.addblock{grid-column:1/-1;min-height:19px;}
  .addrow-inner,.addblock-inner{position:sticky;left:0;display:flex;gap:6px;padding:2px 4px;width:fit-content;}
  .addrow button,.addblock button{font-size:10.5px;color:#5a6472;background:none;border:1px dashed #9aa0a6;padding:1px 8px;cursor:pointer;white-space:nowrap;}
  .addrow button:hover,.addblock button:hover{background:#f2f2f2;}
  .addblock{padding-bottom:10px;}

  .daycell{padding:0;}
  .daycell input.cellinput{width:100%;border:none;background:transparent;text-align:center;font-size:10.5px;padding:1px 0;font-weight:500;}
  .daycell input.cellinput:focus{outline:2px solid #4a86c5;outline-offset:-2px;position:relative;z-index:2;}
  .daycell.flash input.cellinput{animation:flash 1.6s ease-out;}
  @keyframes flash{0%{box-shadow:inset 0 0 0 999px rgba(74,134,197,.55);}100%{box-shadow:inset 0 0 0 999px rgba(74,134,197,0);}}

  .fillhandle{position:absolute;width:7px;height:7px;background:#2f6fb0;border:1px solid #fff;cursor:crosshair;z-index:9;display:none;}
  .fillpreview{outline:2px dashed #2f6fb0;outline-offset:-2px;}
  .cellselected{outline:2px solid #2f6fb0;outline-offset:-2px;box-shadow:inset 0 0 0 999px rgba(47,111,176,.14);}
  .daycell.has-comment::after{content:'';position:absolute;top:0;right:0;width:8px;height:8px;background:#c0272d;clip-path:polygon(100% 0,0 0,100% 100%);pointer-events:none;}

  .settings-wrap{padding:10px 2px;max-width:640px;}
  .setsection{margin-bottom:20px;}
  .setsection h3{font-size:12.5px;margin:0 0 6px;color:#1c1f22;}
  .setlist{display:flex;flex-direction:column;gap:3px;margin-bottom:6px;max-height:340px;overflow:auto;border:1px solid #e0e0e0;padding:4px;}
  .setrow{display:flex;align-items:center;gap:6px;padding:2px 2px;}
  .setlist-header{display:flex;align-items:center;gap:6px;padding:0 2px 3px;margin-bottom:3px;border-bottom:1px solid #c9c9c9;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:#5a6472;}
  .setlist-header .hdr-fill,.setlist-header .hdr-font{width:22px;text-align:center;}
  .setlist-header .hdr-bold{width:26px;text-align:center;}
  .setlist-header .hdr-fields{flex:1;}
  .setrow input[type=color]{width:22px;height:22px;padding:0;border:1px solid #9aa0a6;cursor:pointer;flex-shrink:0;}
  .boldtoggle{display:flex;align-items:center;gap:2px;font-size:11px;font-weight:700;color:#5a6472;cursor:pointer;flex-shrink:0;border:1px solid #d3d3d3;padding:2px 5px;}
  .boldtoggle input{margin:0;cursor:pointer;}
  .setrow input:not([type=color]){font-size:11.5px;padding:2px 5px;border:1px solid #d3d3d3;}
  .del2{border:none;background:none;color:#a4373a;cursor:pointer;font-size:12px;padding:2px 5px;flex-shrink:0;}
  .del2:hover{background:#fbe5e5;}

  .archived-wrap{margin:6px 2px 14px;font-size:11px;color:#5a6472;}
  .archived-wrap summary{cursor:pointer;padding:4px 2px;}
  .archived-row{display:flex;align-items:center;gap:8px;padding:3px 6px;border-top:1px solid #ececec;}
  .archived-row span:first-child{flex:1;color:#1c1f22;}
  .archived-date{font-size:10.5px;color:#5a6472;}

  .history-wrap{padding:10px 2px;max-width:900px;}
  .histtoolbar{display:flex;gap:14px;align-items:center;margin-bottom:14px;font-size:11.5px;color:#5a6472;flex-wrap:wrap;}
  .histtoolbar input[type=date]{font-size:11.5px;padding:3px 6px;border:1px solid #9aa0a6;}
  .histtoolbar input[type=text]{font-size:11.5px;padding:3px 8px;border:1px solid #9aa0a6;width:220px;}
  .histsec{font-size:11.5px;margin:16px 0 4px;color:#1c1f22;}
  .histtable{border-collapse:collapse;font-size:10.5px;margin-bottom:4px;}
  .histtable th,.histtable td{border:1px solid #d3d3d3;padding:3px 6px;text-align:center;}
  .histtable th{background:#eef0f2;font-weight:600;color:#5a6472;}
  .histtable td.histlabel,.histtable td:first-child{text-align:left;font-weight:500;white-space:nowrap;}
  .histempty{font-size:11.5px;color:#5a6472;}
  .histnote{font-size:9.5px;color:#5a6472;border-bottom:1px dotted #5a6472;cursor:help;}

  function isoDate(d){

  function anchorageTodayISO(){

    const parts = new Intl.DateTimeFormat('en-US', { timeZone:'America/Anchorage', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
    const y=parts.find(p=>p.type==='year').value, m=parts.find(p=>p.type==='month').value, d=parts.find(p=>p.type==='day').value;

  function hashNum(key){ let h=0; for(let i=0;i<key.length;i++){ h=(h*31+key.charCodeAt(i))>>>0; } return h; }
  function hslToHex(h,s,l){
    s/=100; l/=100;
    const k = n => (n + h/30) % 12;
    const a = s*Math.min(l,1-l);
    const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));

  }
  function hexToHsl(hex){
    const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h=0, s=0; const l=(max+min)/2;
    if(max!==min){
      const d=max-min;
      s = l>0.5 ? d/(2-max-min) : d/(max+min);
      switch(max){

        case g: h=(b-r)/d+2; break;

  function normalizeState(s){
    // Firebase Realtime Database prunes empty objects/arrays entirely — a row with no
    // assignments yet (cells:{}) or a block with no rows (rows:[]) comes back missing
    // that field rather than empty. Backfill everything our rendering code assumes exists.
    s.employees = (s.employees||[]).map(e=>({ ...e, cells: e.cells||{} }));
    s.boats = s.boats||[];
    s.statusCodes = s.statusCodes||[];
    s.regions = s.regions||{};
    Object.keys(s.regions).forEach(rk=>{
      const reg = s.regions[rk];
      reg.overflow = (reg.overflow||[]).map(r=>({ ...r, cells: r.cells||{} }));

          }
          resolve();

        // every later fire is either our own write echoing back, or a change from someone else
        const incoming = normalizeState(snap.val());
        const json = JSON.stringify(incoming);
        if(json === lastSyncedJSON) return;
        const changed = diffCellIds(state, incoming);
        // navigation/view state is personal to this screen, not something to inherit from whoever last saved
        incoming.activeTab = state.activeTab;

  function scheduleSave(){
    clearTimeout(saveTimer);
    clearTimeout(retryTimer);
    setSyncLabel('Saving…');
    saveTimer = setTimeout(()=> attemptSave(0), 500);
  }
  async function attemptSave(attempt){
    const json = JSON.stringify(state);
    lastSyncedJSON = json; // set before writing: Firebase echoes our own write back through onValue almost immediately, sometimes before this await resolves, and we don't want that echo mistaken for someone else's edit
    try{
      // JSON.stringify silently drops any stray `undefined` value; Firebase's SDK instead throws
      // outright if it sees one, so round-tripping through JSON first guards against that case.
      const clean = JSON.parse(json);
      await set(ref(fbDb, STATE_PATH), clean);
      setSyncLabel('Synced');
    }catch(e){
      console.error('Firebase write failed (attempt '+(attempt+1)+'):', e && e.code ? e.code : e);
      if(attempt < 3){
        setSyncLabel('Save failed — retrying');
        retryTimer = setTimeout(()=> attemptSave(attempt+1), 1500*(attempt+1));
      } else {
        setSyncLabel('Save failed — see browser console (F12)');
      }
    }
  }
  function setSyncLabel(t){ document.getElementById('syncStatus').textContent=t; }

  function diffCellIds(oldState,newState){
    const changed=[];
    function compareRows(oldRows,newRows){
      if(!oldRows||!newRows) return;
      newRows.forEach(nr=>{
        const or=oldRows.find(x=>x.id===nr.id); if(!or) return;
        ALL_DAYS.forEach(d=>{
          const oldTxt=or.cells[d]?or.cells[d].text:''; const newTxt=nr.cells[d]?nr.cells[d].text:'';
          if(oldTxt!==newTxt) changed.push(nr.id+'|'+d);
        });
      });
    }
    compareRows(oldState.employees, newState.employees);
    Object.keys(newState.regions||{}).forEach(rk=>{
      const or=oldState.regions && oldState.regions[rk], nr=newState.regions[rk];
      if(!or||!nr) return;
      compareRows(or.overflow, nr.overflow);
      (nr.blocks||[]).forEach(nb=>{
        const ob=(or.blocks||[]).find(x=>x.id===nb.id);
        if(ob) compareRows(ob.rows, nb.rows);
      });
    });
    return changed;
  }
  function flashCells(ids){
    ids.forEach(cid=>{
      const [rowId,date]=cid.split('|');
      const wrap=document.querySelector('.daycell[data-row="'+rowId+'"][data-date="'+date+'"]');
      if(wrap){ wrap.classList.add('flash'); setTimeout(()=>wrap.classList.remove('flash'),1700); }
    });
  }

  function cellStyle(cellObj, fallbackBg){
    if(cellObj){
      const bg = cellObj.color || colorForText(cellObj.text);
      if(bg){
        const fs = fontStyleFor(cellObj.text, bg);
        return 'background:'+bg+';color:'+fs.color+';font-weight:'+(fs.bold?'700':'500')+';';
      }

    return fallbackBg ? ('background:'+fallbackBg+';') : '';
  }
  function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

  function monthBand(dateStr){
    const dt = new Date(dateStr+'T00:00:00');
    return (dt.getMonth()%2===0) ? '#A2C4C9' : '#9FC5E8'; // matches your workbook's Jan/Mar/May.. vs Feb/Apr/Jun.. header colors
  }
  function blockBand(index){ return (index%2===0) ? '#B7B7B7' : '#D0CECE'; } // matches your workbook's alternating project-row shading

  function dayCellHTML(row,date,fallbackBg){
    const cellObj = row.cells[date];

    const style = cellStyle(cellObj, fallbackBg);
    const todayClass = date===TODAY_ISO ? ' today' : '';
    const comment = cellObj && cellObj.comment ? cellObj.comment : '';
    const commentClass = comment ? ' has-comment' : '';
    const titleAttr = comment ? ' title="'+escAttr(comment)+'"' : '';
    return '<div class="cell daycell'+todayClass+commentClass+'" data-row="'+row.id+'" data-date="'+date+'" style="'+style+'"'+titleAttr+'>'
      + '<input class="cellinput" type="text" value="'+escAttr(text)+'" data-cellinput="'+row.id+'|'+date+'" style="color:inherit;font-weight:inherit">'
      + '</div>';

  function dateHeadHTML(d){
    const dt = new Date(d+'T00:00:00');
    const isToday = d===TODAY_ISO;
    const todayClass = isToday ? ' today' : '';
    const style = isToday ? '' : ' style="background:'+monthBand(d)+'"';
    return '<div class="cell datehead'+todayClass+'"'+style+'><span class="dow">'+DOW[dt.getDay()]+'</span><span class="num">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</span></div>';

  function monthGroups(days){
    const groups = [];
    days.forEach(d=>{
      const dt = new Date(d+'T00:00:00');
      const key = dt.getFullYear()+'-'+dt.getMonth();
      if(groups.length && groups[groups.length-1].key===key) groups[groups.length-1].span++;
      else groups.push({key, span:1, label: dt.toLocaleString('en-US',{month:'long'})});
    });
    return groups;
  }
  function gridHeaderHTML(days){
    let html = '<div class="cell monthcorner" style="grid-column:span 2;"></div>';
    monthGroups(days).forEach(g=>{
      html += '<div class="cell monthhead" style="grid-column:span '+g.span+';">'+g.label.toUpperCase()+'</div>';
    });
    html += '<div class="cell corner c1"></div><div class="cell corner c2">Date</div>';
    days.forEach(d=> html += dateHeadHTML(d));
    return html;
  }

  function lightTint(hex, amt){
    amt = amt===undefined ? 0.82 : amt;
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    const toHex = x=>Math.round(x).toString(16).padStart(2,'0');
    return '#'+toHex(r+(255-r)*amt)+toHex(g+(255-g)*amt)+toHex(b+(255-b)*amt);
  }

  function weekRangeFor(dateIso){
    const dt = new Date(dateIso+'T00:00:00');
    const dow = dt.getDay();
    const start = new Date(dt); start.setDate(dt.getDate()-dow);
    const days = [];
    for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); days.push(isoDate(d)); }
    return days;
  }
  function rowHasDataInRange(row, days){ return days.some(d=> row.cells[d] && row.cells[d].text && row.cells[d].text.trim()!==''); }
  function historyTableHTML(sectionLabel, rows, days, getLabel){
    const matching = rows.filter(r=>rowHasDataInRange(r,days));
    if(!matching.length) return '';
    let html = '<h4 class="histsec">'+escAttr(sectionLabel)+'</h4><table class="histtable"><thead><tr><th></th>';
    days.forEach(d=>{ const dt=new Date(d+'T00:00:00'); html+='<th>'+DOW[dt.getDay()]+'<br>'+(dt.getMonth()+1)+'/'+dt.getDate()+'</th>'; });
    html += '</tr></thead><tbody>';
    matching.forEach(r=>{
      html += '<tr><td class="histlabel">'+escAttr(getLabel(r))+'</td>';
      days.forEach(d=>{
        const c = r.cells[d];
        const txt = c ? (c.text||'') : '';
        const bg = c ? (c.color||colorForText(c.text)) : null;
        const fs = bg ? fontStyleFor(c.text, bg) : null;
        const style = bg ? ' style="background:'+bg+';color:'+fs.color+';font-weight:'+(fs.bold?'700':'500')+';"' : '';
        const title = c && c.comment ? ' title="'+escAttr(c.comment)+'"' : '';
        html += '<td'+style+title+'>'+escAttr(txt)+'</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }
  function renderHistoryTab(container){
    const refDate = state.historyDate || TODAY_ISO;
    const days = weekRangeFor(refDate);
    let toolbar = '<div class="histtoolbar">'
      + '<label>Week of <input type="date" id="historyDateInput" value="'+refDate+'"></label>'
      + '<input type="text" id="historySearchInput" placeholder="or search everywhere by initials/code..." value="'+escAttr(state.historySearch||'')+'">'
      + '</div>';
    let body = '';
    if(state.historySearch && state.historySearch.trim()){
      const q = state.historySearch.trim().toLowerCase();
      const hits = [];
      function scan(rows, contextFn){
        rows.forEach(r=>{
          Object.keys(r.cells).forEach(d=>{
            const c=r.cells[d];
            if(c && c.text && c.text.trim().toLowerCase().includes(q)) hits.push({date:d, context:contextFn(r), text:c.text, comment:c.comment});
          });
        });
      }
      scan(state.employees, r=>'PTO — '+r.name);
      Object.keys(state.regions).forEach(rk=>{
        const reg = state.regions[rk];
        scan(reg.overflow, r=>reg.title+' overflow — '+r.name);
        reg.blocks.forEach(b=> scan(b.rows, r=> reg.title+' — '+b.title+(b.archived?' (closed '+b.archivedDate+')':'')+' — '+r.role));
      });
      hits.sort((a,b)=> a.date<b.date?1:-1);
      body = !hits.length ? '<p class="histempty">No matches for "'+escAttr(state.historySearch)+'".</p>'
        : '<table class="histtable"><thead><tr><th>Date</th><th>Where</th><th>Entry</th></tr></thead><tbody>'
          + hits.map(h=>'<tr><td>'+h.date+'</td><td>'+escAttr(h.context)+'</td><td>'+escAttr(h.text)+(h.comment?' <span class="histnote" title="'+escAttr(h.comment)+'">note</span>':'')+'</td></tr>').join('')
          + '</tbody></table>';
    } else {
      body += historyTableHTML('PTO', state.employees, days, r=>r.initials+' — '+r.name);
      Object.keys(state.regions).forEach(rk=>{
        const reg = state.regions[rk];
        body += historyTableHTML(reg.title+' — overflow', reg.overflow, days, r=>r.initials+' — '+r.name);
        reg.blocks.forEach(b=>{
          const label = b.title + (b.archived ? ' (closed '+b.archivedDate+')' : '');
          body += historyTableHTML(reg.title+' — '+label, b.rows, days, r=>r.role);
        });
      });
      if(!body) body = '<p class="histempty">Nothing on record for this week yet.</p>';
    }
    container.innerHTML = '<div class="history-wrap">'+toolbar+body+'</div>';
  }

  function render(preserveScroll){
    let scrollTop=0, scrollLeft=0;
    if(preserveScroll!==false){
      const prev = document.querySelector('.sheetscroll');
      if(prev){ scrollTop=prev.scrollTop; scrollLeft=prev.scrollLeft; }
    }
    renderTabbar();
    const c = document.getElementById('tabcontent');
    if(state.activeTab==='settings') renderSettingsTab(c);
    else if(state.activeTab==='pto') renderPTOTab(c);
    else if(state.activeTab==='history') renderHistoryTab(c);
    else renderRegionTab(c, state.activeTab);
    if(preserveScroll!==false){
      const next = document.querySelector('.sheetscroll');
      if(next){ next.scrollTop=scrollTop; next.scrollLeft=scrollLeft; }
    }
  }

  function groupRowsFor(rowId){
    for(const rk of Object.keys(state.regions)){
      for(const b of state.regions[rk].blocks){
        if(b.rows.some(r=>r.id===rowId)) return b.rows;
      }
    }
    const found = findRow(rowId);
    return found ? [found.row] : [];
  }
  function verticalSiblingsFor(rowId){
    if(state.employees.some(e=>e.id===rowId)) return state.employees;
    for(const rk of Object.keys(state.regions)){
      const reg = state.regions[rk];
      if(reg.overflow.some(r=>r.id===rowId)) return reg.overflow;
      for(const b of reg.blocks){
        if(b.rows.some(r=>r.id===rowId)) return b.rows;
      }
    }
    return [];
  }

  // ---- multi-cell range selection + copy/paste ----
  let currentSelection = null; // {rowIds:[...], dates:[...]}
  let clipboardData = null;    // 2D array [rowIndex][dateIndex] -> cellData or null
  let selectionHighlighted = [];
  function allRowElements(){
    return Array.from(document.querySelectorAll('.lblname[data-row]'));
  }
  function computeSelectionRect(startRowId, startDate, endRowId, endDate){
    const days = visibleDays();
    const di1=days.indexOf(startDate), di2=days.indexOf(endDate);
    if(di1===-1||di2===-1) return {rowIds:[startRowId], dates:[startDate]};
    const dates = days.slice(Math.min(di1,di2), Math.max(di1,di2)+1);
    const rowEls = allRowElements();
    const i1 = rowEls.findIndex(el=>el.dataset.row===startRowId);
    const i2 = rowEls.findIndex(el=>el.dataset.row===endRowId);
    if(i1===-1||i2===-1) return {rowIds:[startRowId], dates};
    const rowIds = rowEls.slice(Math.min(i1,i2), Math.max(i1,i2)+1).map(el=>el.dataset.row);
    return {rowIds, dates};
  }
  function clearSelectionHighlight(){
    selectionHighlighted.forEach(sel=>{ const el=document.querySelector(sel); if(el) el.classList.remove('cellselected'); });
    selectionHighlighted = [];
  }
  function applySelectionHighlight(sel){
    if(!sel || (sel.rowIds.length<=1 && sel.dates.length<=1)) return;
    const found=[];
    sel.rowIds.forEach(rid=>{
      sel.dates.forEach(d=>{
        const s = '.daycell[data-row="'+rid+'"][data-date="'+d+'"]';
        const el = document.querySelector(s);
        if(el){ el.classList.add('cellselected'); found.push(s); }
      });
    });
    selectionHighlighted = found;
  }
  function buildClipboard(sel){
    return sel.rowIds.map(rid=>{
      const found = findRow(rid);
      return sel.dates.map(d => (found && found.row.cells[d]) ? JSON.parse(JSON.stringify(found.row.cells[d])) : null);
    });
  }
  function pasteClipboardAt(anchorRowId, anchorDate){
    if(!clipboardData || !clipboardData.length) return;
    const rowEls = allRowElements();
    const anchorRowIdx = rowEls.findIndex(el=>el.dataset.row===anchorRowId);
    const days = visibleDays();
    const anchorDateIdx = days.indexOf(anchorDate);
    if(anchorRowIdx===-1 || anchorDateIdx===-1) return;
    clipboardData.forEach((rowData, ri)=>{
      const targetRowEl = rowEls[anchorRowIdx+ri];
      if(!targetRowEl) return;
      const found = findRow(targetRowEl.dataset.row);
      if(!found) return;
      rowData.forEach((cellData, ci)=>{
        const targetDate = days[anchorDateIdx+ci];
        if(!targetDate) return;
        found.row.cells[targetDate] = cellData ? JSON.parse(JSON.stringify(cellData)) : {text:''};
      });
    });
    render(); scheduleSave();
  }

  let rangeDrag = null;
  document.addEventListener('mousedown', e=>{
    if(e.target.matches('.cellinput')){
      const cellEl = e.target.closest('.daycell');
      rangeDrag = { startRow:cellEl.dataset.row, startDate:cellEl.dataset.date, startX:e.clientX, startY:e.clientY, moved:false };
    }
  });
  document.addEventListener('mousemove', e=>{
    if(!rangeDrag) return;
    if(!rangeDrag.moved){
      const dx=Math.abs(e.clientX-rangeDrag.startX), dy=Math.abs(e.clientY-rangeDrag.startY);
      if(dx<5 && dy<5) return;
      rangeDrag.moved = true;
      if(document.activeElement && document.activeElement.matches('.cellinput')) document.activeElement.blur();
    }
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const cellEl = el && el.closest && el.closest('.daycell');
    if(!cellEl) return;
    const sel = computeSelectionRect(rangeDrag.startRow, rangeDrag.startDate, cellEl.dataset.row, cellEl.dataset.date);
    currentSelection = sel;
    clearSelectionHighlight();
    applySelectionHighlight(sel);
  });
  document.addEventListener('mouseup', ()=>{ rangeDrag = null; });
  document.addEventListener('keydown', e=>{
    const isCtrl = e.ctrlKey || e.metaKey;
    if(!isCtrl) return;
    const onGridTab = state.activeTab!=='settings' && state.activeTab!=='history';
    if(!onGridTab || !currentSelection) return;
    if(e.key==='c' || e.key==='C'){
      e.preventDefault();
      clipboardData = buildClipboard(currentSelection);
    } else if(e.key==='v' || e.key==='V'){
      e.preventDefault();
      pasteClipboardAt(currentSelection.rowIds[0], currentSelection.dates[0]);
    }
  });

  function showFillHandle(rowId, date){
    const group = groupRowsFor(rowId);
    if(!group.length) return;
    const lastRow = group[group.length-1];
    const targetCell = document.querySelector('.daycell[data-row="'+lastRow.id+'"][data-date="'+date+'"]');
    const sheetEl = document.getElementById('sheet');
    if(!targetCell || !sheetEl) return;
    let handle = document.getElementById('fillhandle');
    if(!handle){ handle=document.createElement('div'); handle.id='fillhandle'; handle.className='fillhandle'; sheetEl.appendChild(handle); }
    else if(handle.parentElement !== sheetEl){ sheetEl.appendChild(handle); }
    handle.style.left = (targetCell.offsetLeft + targetCell.offsetWidth - 5) + 'px';
    handle.style.top = (targetCell.offsetTop + targetCell.offsetHeight - 5) + 'px';
    handle.style.display = 'block';
    handle.dataset.originRow = rowId;
    handle.dataset.originDate = date;
  }
  function hideFillHandle(){ const h=document.getElementById('fillhandle'); if(h) h.style.display='none'; }
  function clearFillPreview(fd){ (fd.lastHighlighted||[]).forEach(sel=>{ const e2=document.querySelector(sel); if(e2) e2.classList.remove('fillpreview'); }); }

  let fillDrag = null;
  document.addEventListener('mousedown', e=>{
    if(e.target && e.target.id==='fillhandle'){
      e.preventDefault();
      const originRow=e.target.dataset.originRow, originDate=e.target.dataset.originDate;
      const group = groupRowsFor(originRow);
      fillDrag = {
        originRow, originDate,
        startX: e.clientX, startY: e.clientY, axis: null,
        group: group.map(r=>({ id:r.id, cellData: r.cells[originDate] ? JSON.parse(JSON.stringify(r.cells[originDate])) : null })),
        lastHighlighted: [], currentRange:[originDate], verticalRowIds: []
      };
    }
  });
  document.addEventListener('mousemove', e=>{
    if(!fillDrag) return;
    if(!fillDrag.axis){
      const dx=Math.abs(e.clientX-fillDrag.startX), dy=Math.abs(e.clientY-fillDrag.startY);
      if(dx<5 && dy<5) return;
      fillDrag.axis = (dy>dx) ? 'v' : 'h';
    }
    if(fillDrag.axis==='h'){
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const cellEl = el && el.closest && el.closest('.daycell');
      if(!cellEl) return;
      const targetDate = cellEl.dataset.date;
      const days = visibleDays();
      const oi=days.indexOf(fillDrag.originDate), ti=days.indexOf(targetDate);
      if(oi===-1||ti===-1) return;
      const lo=Math.min(oi,ti), hi=Math.max(oi,ti);
      const rangeDates = days.slice(lo,hi+1);
      clearFillPreview(fillDrag);
      const newSel=[];
      fillDrag.group.forEach(g=>{
        rangeDates.forEach(d=>{
          const sel='.daycell[data-row="'+g.id+'"][data-date="'+d+'"]';
          const e2=document.querySelector(sel);
          if(e2){ e2.classList.add('fillpreview'); newSel.push(sel); }
        });
      });
      fillDrag.lastHighlighted = newSel;
      fillDrag.currentRange = rangeDates;
    } else {
      const siblings = verticalSiblingsFor(fillDrag.originRow).map(r=>r.id);
      const colCells = Array.from(document.querySelectorAll('.daycell[data-date="'+fillDrag.originDate+'"]'))
        .filter(el=>siblings.includes(el.dataset.row));
      const originEl = document.querySelector('.daycell[data-row="'+fillDrag.originRow+'"][data-date="'+fillDrag.originDate+'"]');
      if(!originEl || !colCells.length) return;
      const originTop = originEl.getBoundingClientRect().top;
      const lo=Math.min(originTop,e.clientY), hi=Math.max(originTop,e.clientY);
      const targets = colCells.filter(el=>{
        const r=el.getBoundingClientRect(); const mid=r.top+r.height/2;
        return mid>=lo-2 && mid<=hi+2;
      });
      clearFillPreview(fillDrag);
      const newSel=[];
      targets.forEach(el=>{ el.classList.add('fillpreview'); newSel.push('.daycell[data-row="'+el.dataset.row+'"][data-date="'+fillDrag.originDate+'"]'); });
      fillDrag.lastHighlighted = newSel;
      fillDrag.verticalRowIds = targets.map(el=>el.dataset.row).filter(id=>id!==fillDrag.originRow);
    }
  });
  document.addEventListener('mouseup', e=>{
    if(!fillDrag) return;
    if(fillDrag.axis==='v'){
      const originFound = findRow(fillDrag.originRow);
      const originCellData = originFound && originFound.row.cells[fillDrag.originDate] ? JSON.parse(JSON.stringify(originFound.row.cells[fillDrag.originDate])) : {text:''};
      fillDrag.verticalRowIds.forEach(rid=>{
        const found = findRow(rid);
        if(found) found.row.cells[fillDrag.originDate] = JSON.parse(JSON.stringify(originCellData));
      });
    } else if(fillDrag.axis==='h'){
      const range = (fillDrag.currentRange && fillDrag.currentRange.length) ? fillDrag.currentRange : [fillDrag.originDate];
      fillDrag.group.forEach(g=>{
        const found = findRow(g.id);
        if(!found) return;
        range.forEach(d=>{
          if(d===fillDrag.originDate) return;
          found.row.cells[d] = g.cellData ? JSON.parse(JSON.stringify(g.cellData)) : {text:''};
        });
      });
    }
    clearFillPreview(fillDrag);
    fillDrag = null;
    render(); scheduleSave();
  });

  document.addEventListener('contextmenu', e=>{
    const cellEl = e.target.closest && e.target.closest('.daycell');
    if(!cellEl) return;
    e.preventDefault();
    const rowId=cellEl.dataset.row, date=cellEl.dataset.date;
    const found=findRow(rowId); if(!found) return;
    const existing = (found.row.cells[date] && found.row.cells[date].comment) || '';
    const val = prompt('Comment for this cell (leave blank to remove):', existing);
    if(val===null) return;
    found.row.cells[date] = found.row.cells[date] || {text:''};
    if(val.trim()==='') delete found.row.cells[date].comment;
    else found.row.cells[date].comment = val;
    render(); scheduleSave();
  });

  document.addEventListener('input', e=>{
    const t=e.target;
    if(t.matches('[data-cellinput]')){
      const [rowId,date]=t.dataset.cellinput.split('|');
      const found=findRow(rowId); if(!found) return;
      found.row.cells[date]=found.row.cells[date]||{};
      found.row.cells[date].text=t.value;
      const wrap=t.closest('.daycell');
      wrap.style.cssText=cellStyle(found.row.cells[date], monthBand(date));
      scheduleSave();
    } else if(t.matches('[data-field]')){
      const [field,id]=t.dataset.field.split('|');
      if(field==='blocktitle'||field==='blockmeta'){ const b=findBlock(id); if(b) b[field==='blocktitle'?'title':'meta']=t.value; }
      else if(field==='role'){ const found=findRow(id); if(found) found.row.role=t.value; }
      else if(field==='name'){ const found=findRow(id); if(found) found.row.name=t.value; }
      else if(field==='initials'){ const found=findRow(id); if(found) found.row.initials=t.value; }
      scheduleSave();
    } else if(t.id==='historySearchInput'){
      state.historySearch = t.value;
      render();
      document.getElementById('historySearchInput').focus();
      const val=document.getElementById('historySearchInput').value;
      document.getElementById('historySearchInput').setSelectionRange(val.length,val.length);
    }
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.matches('input')) e.target.blur(); });
  document.addEventListener('focusin', e=>{
    if(e.target.matches('.cellinput')){
      e.target.select();
      const [rowId,date] = e.target.dataset.cellinput.split('|');
      showFillHandle(rowId,date);
      if(!(rangeDrag && rangeDrag.moved)){
        clearSelectionHighlight();
        currentSelection = {rowIds:[rowId], dates:[date]};
      }
    }
  });
  document.addEventListener('focusout', e=>{ if(e.target.matches('.cellinput')) hideFillHandle(); });
  document.addEventListener('change', e=>{
    const t=e.target;
    if(t.matches('.initials-input')){
      render();
    } else if(t.matches('[data-setfield]')){
      const [list,id,field]=t.dataset.setfield.split('|');
      const item=(state[list]||[]).find(x=>x.id===id);
      if(item) item[field]=t.value;
      render(); scheduleSave();
    } else if(t.matches('[data-setcolor]')){
      const [list,id]=t.dataset.setcolor.split('|');
      const item=(state[list]||[]).find(x=>x.id===id);
      if(item) item.color=t.value;
      render(); scheduleSave();
    } else if(t.matches('[data-setfontcolor]')){
      const [list,id]=t.dataset.setfontcolor.split('|');
      const item=(state[list]||[]).find(x=>x.id===id);
      if(item) item.fontColor=t.value;
      render(); scheduleSave();
    } else if(t.matches('[data-setbold]')){
      const [list,id]=t.dataset.setbold.split('|');
      const item=(state[list]||[]).find(x=>x.id===id);
      if(item) item.bold=t.checked;
      render(); scheduleSave();
    } else if(t.matches('[data-setregiontitle]')){
      const rk = t.dataset.setregiontitle;
      if(state.regions[rk]) state.regions[rk].title = t.value;
      render(); scheduleSave();
    } else if(t.matches('[data-setregioncolor]')){
      const rk = t.dataset.setregioncolor;
      if(state.regions[rk]){ state.regions[rk].color = t.value; state.regions[rk].tint = lightTint(t.value); }
      render(); scheduleSave();
    } else if(t.id==='historyDateInput'){
      state.historyDate = t.value;
      render();
    }
  });
  document.addEventListener('click', e=>{
    const t=e.target;
    if(t.matches('[data-tab]')){
      state.activeTab=t.dataset.tab;
      try{ localStorage.setItem(LAST_TAB_KEY, state.activeTab); }catch(e){}
      render(false);
      return;
    }
    if(t.matches('[data-delrow]')){ const found=findRow(t.dataset.delrow); if(found && confirm('Remove this row?')){ found.remove(); render(); scheduleSave(); } return; }
    if(t.matches('[data-delblock]')){
      const b=findBlock(t.dataset.delblock);
      if(b && confirm('Mark "'+b.title+'" complete and move it to History? Its data stays on record — nothing is deleted.')){
        b.archived = true;
        b.archivedDate = TODAY_ISO;
        render(); scheduleSave();
      }
      return;
    }
    if(t.matches('[data-restoreblock]')){
      const b=findBlock(t.dataset.restoreblock);
      if(b){ b.archived=false; delete b.archivedDate; render(); scheduleSave(); }
      return;
    }
    if(t.matches('[data-deleteblock]')){
      const b=findBlock(t.dataset.deleteblock);
      if(b && confirm('Permanently delete "'+b.title+'"? This cannot be undone — unlike closing a project, this actually erases its data for good.')){
        for(const rk of Object.keys(state.regions)){
          state.regions[rk].blocks = state.regions[rk].blocks.filter(x=>x.id!==b.id);
        }
        render(); scheduleSave();
      }
      return;
    }
    if(t.matches('[data-addrow-block]')){ const b=findBlock(t.dataset.addrowBlock); if(b) b.rows.push({id:newId(),role:'New role',cells:{}}); render(); scheduleSave(); return; }
    if(t.matches('[data-addblock-region]')){
      const rk=t.dataset.addblockRegion;
      state.regions[rk].blocks.push({id:newId(),title:'New project',meta:'PM:',rows:[{id:newId(),role:'Surveyor',cells:{}},{id:newId(),role:'Operator',cells:{}}]});
      render(); scheduleSave(); return;
    }
    if(t.matches('[data-addblock-after]')){
      const afterId = t.dataset.addblockAfter;
      for(const rk of Object.keys(state.regions)){
        const blocks = state.regions[rk].blocks;
        const idx = blocks.findIndex(b=>b.id===afterId);
        if(idx!==-1){
          blocks.splice(idx+1, 0, {id:newId(),title:'New project',meta:'PM:',rows:[{id:newId(),role:'Surveyor',cells:{}},{id:newId(),role:'Operator',cells:{}}]});
          break;
        }
      }
      render(); scheduleSave(); return;
    }
    if(t.matches('[data-addoverflow-region]')){
      const rk=t.dataset.addoverflowRegion;
      const initials=prompt('Initials of the employee to add (must already exist under Settings > Employees):');
      if(!initials) return;
      const emp=state.employees.find(e=>e.initials && e.initials.toLowerCase()===initials.trim().toLowerCase());
      if(!emp){ alert('No employee found with those initials. Add them in Settings first.'); return; }
      state.regions[rk].overflow.push({id:newId(), initials:emp.initials, name:emp.name, cells:{}});
      render(); scheduleSave(); return;
    }
    if(t.matches('[data-addsetitem]')){
      const list=t.dataset.addsetitem;
      if(list==='employees') state.employees.push({id:newId(), initials:'', name:'New employee', color:hashColor(newId()), cells:{}});
      else if(list==='boats') state.boats.push({id:newId(), code:'', name:'New boat', color:hashColor(newId())});
      else if(list==='statusCodes') state.statusCodes.push({id:newId(), code:'', label:'New code', color:hashColor(newId())});
      render(); scheduleSave(); return;
    }
    if(t.matches('[data-addregion]')){
      const key = 'region_'+newId();
      const color = nextRegionColor();
      state.regions[key] = { title:'New Section', color, tint:lightTint(color), overflow:[], blocks:[] };
      render(); scheduleSave(); return;
    }
    if(t.matches('[data-setdel]')){
      const [list,id]=t.dataset.setdel.split('|');
      if(confirm('Remove this entry?')){ state[list]=state[list].filter(x=>x.id!==id); render(); scheduleSave(); }
      return;
    }
  });
  document.getElementById('hidePastToggle').addEventListener('change', e=>{ state.hidePast=!e.target.checked; render(); scheduleSave(); });

  function startDateWatcher(){
    setInterval(()=>{
      const nowIso = anchorageTodayISO();
      if(nowIso !== TODAY_ISO){ computeDays(); render(); }
    }, 60000);
  }

  const LAST_TAB_KEY = 'woolpert_last_tab';

  let appStarted = false;
  async function startApp(){
    if(appStarted) return;
    appStarted = true;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = '';
    await loadState();
    try{
      const savedTab = localStorage.getItem(LAST_TAB_KEY);
      if(savedTab && getTabs().some(t=>t.id===savedTab)) state.activeTab = savedTab;
    }catch(e){}
    document.getElementById('hidePastToggle').checked = !state.hidePast;
    render();
    startDateWatcher();
  }

  onAuthStateChanged(fbAuth, (user)=>{
    if(user){ startApp(); }
    else{
      appStarted = false;
      document.getElementById('appRoot').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try{
      await signInWithEmailAndPassword(fbAuth, email, pass);
    }catch(err){
      errEl.textContent = 'Incorrect username or password.';
    }
  });

  document.getElementById('signOutBtn').addEventListener('click', ()=>{
    signOut(fbAuth);
  });
})();
</script>
</body>
</html>
